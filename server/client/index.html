<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0C0B">
<title>The Team Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0C0B; --ink: #C6C2B6; --danger: #D6452B; --amber: #D9A24B; --green: #5FC98A;
    --mono: 'IBM Plex Mono', ui-monospace, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #050605; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Desktop: a phone-sized frame. Phones: full bleed. */
  #phone { width: 402px; height: 874px; border-radius: 48px; overflow: hidden; position: relative; background: var(--bg);
    box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(198,194,182,.08); transform-origin: center; flex: none; }
  #island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50; }
  @media (max-width: 500px) {
    #phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; transform: none !important; }
    #island { display: none; }
  }
  #app { position: absolute; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .scan { position: absolute; inset: 0; pointer-events: none; z-index: 20; background-image: repeating-linear-gradient(0deg, rgba(198,194,182,.035) 0 1px, transparent 1px 3px); }
  .screen { position: absolute; inset: 0; }
  .col { display: flex; flex-direction: column; }
  .m { font-family: var(--mono); }
  .btn { height: 58px; display: flex; align-items: center; justify-content: center; cursor: pointer; font: 600 13px var(--mono); letter-spacing: .16em; border: 1px solid transparent; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { border-color: rgba(198,194,182,.4); color: var(--ink); font-weight: 500; }
  .btn.ghost:hover { border-color: var(--ink); background: rgba(198,194,182,.06); }
  .btn.off { background: transparent; border-color: rgba(198,194,182,.25); color: rgba(198,194,182,.45); cursor: default; }
  .link { text-align: center; font: 400 11px var(--mono); letter-spacing: .14em; color: rgba(198,194,182,.62); cursor: pointer; padding: 10px; }
  .link:hover { color: var(--ink); }
  .kicker { font: 600 10px var(--mono); letter-spacing: .2em; color: var(--amber); }
  .field { height: 48px; background: transparent; border: 1px solid rgba(198,194,182,.3); color: var(--ink); font: 500 14px var(--mono); letter-spacing: .1em; padding: 0 14px; outline: none; border-radius: 0; min-width: 0; }
  .field:focus { border-color: var(--ink); }
  .row { display: flex; align-items: center; }
  .tap { cursor: pointer; }
  @keyframes vlblink { 0%, 45% { opacity: 1 } 50%, 95% { opacity: .3 } 100% { opacity: 1 } }
  @keyframes vlrip { 0% { transform: translate(-50%, -50%) scale(.25); opacity: .95 } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0 } }
  @keyframes vlmark { 0% { opacity: .7 } 100% { opacity: 0 } }
  @keyframes vldash { to { stroke-dashoffset: -28 } }
  @keyframes vlin { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes vlshake { 0% { transform: translateX(0) } 15% { transform: translateX(-7px) } 30% { transform: translateX(6px) } 45% { transform: translateX(-4px) } 60% { transform: translateX(3px) } 100% { transform: translateX(0) } }
  @keyframes vlflash { 0% { opacity: .55 } 100% { opacity: 0 } }
  @keyframes vlflare { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
  .blink { animation: vlblink 1.1s steps(1, end) infinite; }
  .fadein { animation: vlin .25s ease-out both; }
  .toast { position: absolute; left: 24px; right: 24px; bottom: 56px; z-index: 40; padding: 12px 14px; border: 1px solid rgba(214,69,43,.5); background: rgba(214,69,43,.12); font: 500 11px var(--mono); letter-spacing: .1em; color: var(--danger); text-align: center; }

  /* ── co-op tokens (scattered, unwrap on claim) ── */
  .tokboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); container-type: inline-size; }
  .ctok { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); cursor: pointer; --c: var(--ink); --ring: 2px; }
  .ctok > * { position: absolute; pointer-events: none; }
  .ctok .half { top: 0; bottom: 0; width: 50%; background: #111412; border: var(--ring) solid var(--c); }
  .ctok .half.l { left: 0; border-right: 0; border-radius: 9999px 0 0 9999px; }
  .ctok .half.r { right: 0; border-left: 0; border-radius: 0 9999px 9999px 0; }
  .ctok.mine .half { background: color-mix(in srgb, var(--c) 22%, #111412); }
  .ctok .num { inset: 0; display: flex; align-items: center; justify-content: center; font: 600 clamp(14px, 5.6cqw, 22px) var(--mono); color: var(--c); }
  .ctok .burst { inset: 0; border-radius: 50%; border: var(--ring) solid var(--c); opacity: 0; }
  .ctok .tick { inset: 26%; border-radius: 50%; border: 1.5px dashed rgba(198,194,182,.3); display: none; align-items: center; justify-content: center; color: rgba(198,194,182,.35); font: 600 clamp(9px, 3.2cqw, 13px) var(--mono); }
  .ctok.next::after { content: ''; position: absolute; inset: -16%; border-radius: 50%; border: 1.5px solid var(--c); opacity: .45; animation: nextPulse 1.1s ease-in-out infinite; pointer-events: none; }
  .ctok.mine.next::after { border-width: 2.5px; opacity: .95; }
  @keyframes nextPulse { 50% { transform: scale(1.12); opacity: .12; } }
  .ctok.unwrap::after { display: none; }
  .ctok.unwrap .half.l { animation: peelL .5s cubic-bezier(.25, .6, .35, 1) forwards; }
  .ctok.unwrap .half.r { animation: peelR .5s cubic-bezier(.25, .6, .35, 1) forwards; }
  .ctok.unwrap .num { animation: numLift .5s ease-out forwards; }
  .ctok.unwrap .burst { animation: burst .6s ease-out .05s forwards; }
  .ctok.unwrap .tick { display: flex; animation: tickIn .35s ease-out .35s both; }
  .ctok.done > * { display: none; }
  .ctok.done .tick { display: flex; }
  @keyframes peelL { to { transform: translateX(-75%) rotate(-40deg); opacity: 0; } }
  @keyframes peelR { to { transform: translateX(75%) rotate(40deg); opacity: 0; } }
  @keyframes numLift { 30% { transform: scale(1.25); } to { transform: translateY(-70%) scale(1.1); opacity: 0; } }
  @keyframes burst { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes tickIn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .ctok.next::after, .blink { animation: none; }
    .ctok.unwrap .half, .ctok.unwrap .num { animation: fadeOut .2s forwards; }
    .ctok.unwrap .burst { animation: none; }
    .ctok.unwrap .tick { animation: none; }
    @keyframes fadeOut { to { opacity: 0; } }
  }
</style>
</head>
<body>
<div id="phone"><div id="island"></div><div id="app"><div class="scan"></div><div id="screen" class="screen"></div></div></div>

<script src="/teamtest-net.js"></script>
<script src="/shared/tasks.js"></script>
<script>
(function () {
  'use strict';
  const Net = window.TeamTestNet;
  const T = window.TeamTestTasks;

  // ── palette ─────────────────────────────────────────────
  const SLOT_HEX = { 1: '#C6C2B6', 2: '#5FC98A', 3: '#D9A24B', 4: '#4FC0D0' };
  const NAMED = { GREEN: '#5FC98A', YELLOW: '#D9A24B', BLUE: '#4FC0D0', WHITE: '#C6C2B6' };
  const SHAPE = { square: { r: '0', rot: '0deg' }, circle: { r: '50%', rot: '0deg' }, diamond: { r: '2px', rot: '45deg' } };
  const INK = '#C6C2B6', DANGER = '#D6452B', AMBER = '#D9A24B', GREEN = '#5FC98A', BG = '#0A0C0B';
  const a = (hex, alpha) => {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  };
  const LABELS = { MEMORY: 'MEMORY', SEQUENCE: 'SEQUENCE', SHELL: 'TRACKING', STROOP: 'INTERFERENCE', COUNT: 'COUNTING', SLIDE: 'ALIGNMENT', GATE: 'MOTOR CONTROL', DIGITS: 'SCANNING', ORDER: 'RECALL' };

  // ── dom helper ──────────────────────────────────────────
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'style') e.style.cssText = v;
      else if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    return e;
  }
  const span = (style, text) => h('span', { style, text });
  const $screen = document.getElementById('screen');
  const $app = document.getElementById('app');

  // ── identity ────────────────────────────────────────────
  const qs = new URLSearchParams(location.search);
  let pid = qs.get('p');
  // ?p= wins (handy for testing several players in one browser), then this tab, then this device.
  const tryStore = (k) => { try { return window[k]; } catch (e) { return null; } };
  const tabStore = tryStore('sessionStorage'), devStore = tryStore('localStorage');
  const read = (st) => { try { return st && st.getItem('tt.pid'); } catch (e) { return null; } };
  const write = (st, v) => { try { if (st) st.setItem('tt.pid', v); } catch (e) { /* storage blocked */ } };
  const fromUrl = !!pid;
  if (!pid) pid = read(tabStore) || read(devStore);
  if (!pid || !/^[A-Za-z0-9_-]{1,32}$/.test(pid)) pid = 'p' + Math.random().toString(36).slice(2, 8);
  write(tabStore, pid);
  if (!fromUrl) write(devStore, pid);
  const inviteCode = qs.get('room');

  // ── state ───────────────────────────────────────────────
  const S = {
    screen: 'title', briefNext: 'queue', joinOpen: false, nameOpen: false, handle: null,
    slot: 0, code: null, priv: false, host: null, roster: [],
    life: {}, disp: {}, decay: 0.42, startsAt: 0, partnerMap: {},
    task: null, coop: null, phase: null, cut: false, waiting: null, incoming: 0, paused: false,
    ended: null, friends: [], board: [], copied: false, taskNo: 0, pres: {}, toast: null,
    clockOffset: -Infinity,
  };
  const now = () => Date.now() + (isFinite(S.clockOffset) ? S.clockOffset : 0);
  const rosterBySlot = (slot) => S.roster.find((r) => r.slot === slot) || null;
  const slotOf = (id) => (S.roster.find((r) => r.playerId === id) || {}).slot || 0;
  const nameOf = (slot) => (slot === S.slot ? 'YOU' : 'P' + slot);
  const colOf = (slot) => SLOT_HEX[slot] || INK;
  const others = () => [1, 2, 3, 4].filter((s) => s !== S.slot);   // → top, right, bottom edges
  const partnerSlot = () => slotOf(S.partnerMap[pid]);
  const feederSlot = () => slotOf(Object.keys(S.partnerMap).find((k) => S.partnerMap[k] === pid));
  const mySeat = () => S.slot - 1;

  // ── net ─────────────────────────────────────────────────
  const send = (type, payload) => Net.send(type, payload || {});
  Net.logLevel = qs.get('debug') ? 'debug' : 'warn';
  Net.identify(null, pid);
  Net.onMessage((type, p, f) => {
    if (!f.local && typeof f.t === 'number') S.clockOffset = Math.max(S.clockOffset, f.t - Date.now());
    const fn = ON[type];
    if (fn) fn(p || {}, f);
  });
  Net.connect((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

  let joinedOnce = false;
  const ON = {
    'hello': (p) => { S.handle = p.handle; if (S.screen === 'title') render(); },
    'account': (p) => { S.handle = p.handle; S.nameOpen = false; if (S.screen === 'title') render(); showToast('NAME SAVED · ' + p.handle.toUpperCase(), true); },
    'pong': (p) => { if (typeof p.t === 'number') S.rtt = S.rtt == null ? Date.now() - p.t : Math.round(S.rtt * 0.6 + (Date.now() - p.t) * 0.4); },
    'net.open': () => {
      send('ping');
      if (inviteCode && !joinedOnce) { joinedOnce = true; send('room.join', { code: inviteCode }); }
    },
    'room.joined': (p) => {
      S.code = p.code; S.slot = p.slot; S.host = p.host; S.roster = p.roster; S.priv = p.private; Net.roomId = p.code;
      if (S.screen !== 'play' && S.screen !== 'over') go(p.private ? 'room' : 'queue');
      else render();
      if (p.private) send('friend.list');
    },
    'queue.joined': (p) => { S.queueSince = Date.now(); S.botsAfterMs = p.botsAfterMs || 10000; if (S.screen !== 'play') go('queue'); },
    'room.player_joined': (p) => {
      const r = rosterBySlot(p.slot);
      const row = { slot: p.slot, playerId: p.playerId, handle: p.handle, colour: p.colour, bot: p.bot, online: true };
      if (r) Object.assign(r, row); else S.roster.push(row);
      if (S.screen === 'room' || S.screen === 'queue') render();
    },
    'room.player_left': (p) => {
      const r = rosterBySlot(p.slot);
      if (r && (S.screen === 'room' || S.screen === 'queue')) S.roster = S.roster.filter((x) => x !== r);
      else if (r) r.online = false;
      if (S.screen === 'room' || S.screen === 'queue') render();
    },
    'room.host': (p) => { S.host = p.playerId; render(); },
    'room.lobby': (p) => { S.host = p.host; S.roster = p.roster; },
    'room.left': () => { resetRoom(); go('title'); },
    'queue.left': () => { resetRoom(); go('title'); },
    'room.paused': (p) => { S.paused = p; renderOverlay(); },
    'room.resumed': () => { S.paused = false; renderOverlay(); },
    'room.ready': (p) => {
      S.roster = p.roster; S.life = p.life; S.startsAt = p.startsAt; S.partnerMap = p.partnerMap; S.ended = null;
      for (const k in p.life) if (!(k in S.disp) || !p.resumed) S.disp[k] = p.life[k];
      if (!p.resumed) { S.task = null; S.coop = null; S.waiting = null; S.incoming = 0; S.cut = false; S.taskNo = 0; }
      go('play');
    },
    'life.sync': (p) => { S.life = p.life; S.decay = p.decay; },
    'life.penalty': (p) => { if (p.playerId === pid) jolt(false); },
    'phase.solo': (p) => { S.phase = p; S.cut = false; S.waiting = null; S.incoming = 0; },
    'phase.cutoff': (p) => { S.phase = p; S.cut = true; },
    'phase.waiting': (p) => { S.waiting = p; S.task = null; },
    'phase.solo_end': (p) => { S.waiting = null; S.task = null; S.incoming = p.coopAt; S.incomingVariant = p.variant || null; },
    'task.assign': (x) => { S.waiting = null; S.incoming = 0; startTask(x); },
    'task.progress': (p) => onProgress(p),
    'task.result': (p) => {
      const tk = S.task;
      if (!tk || tk.a.id !== p.id) return;
      tk.result = p; tk.rev++;
      jolt(p.ok);
      myRipple(p.ok);
    },
    'round.settle': (p) => onSettle(p),
    'coop.state': (p) => { S.coop = p; updateCoop(); },
    'coop.solved': () => coopDone(true),
    'coop.expired': () => coopDone(false),
    'coop.overheat': () => jolt(false),
    'presence.move': (p) => { S.pres[p.slot || slotOf(p.playerId)] = { x: p.x, y: p.y, t: performance.now() }; },
    'presence.tap': (p) => edgeRipple(p),
    'run.ended': (p) => { S.ended = p; S.task = null; S.paused = false; renderOverlay(); go('over'); },
    'friend.list': (p) => { S.friends = p.friends; if (S.screen === 'room') render(); },
    'friend.presence': (p) => {
      const i = S.friends.findIndex((f) => f.playerId === p.playerId);
      if (i >= 0) { S.friends[i] = p; if (S.screen === 'room') render(); }
    },
    'room.invite_sent': () => showToast('INVITE SENT', true),
    'room.invited': (p) => showToast('INVITE FROM ' + (p.handle || p.from).toUpperCase() + ' · ' + p.code, true, () => send('room.join', { code: p.code })),
    'leaderboard': (p) => { S.board = p.rows; if (S.screen === 'board') render(); },
    'error': (p) => {
      const msg = {
        no_such_room: 'NO ROOM WITH THAT CODE', room_full: 'THAT ROOM IS FULL', run_in_progress: 'A RUN IS ALREADY GOING',
        not_friends: 'NOT ON YOUR FRIENDS LIST', player_offline: 'THEY ARE OFFLINE', no_such_player: 'NO PLAYER BY THAT NAME',
        not_host: 'ONLY THE HOST CAN START', handle_taken: 'THAT NAME IS TAKEN', bad_handle: 'NAMES ARE 2–20 LETTERS, NUMBERS, SPACES', friend_not_in_room: 'THEY ARE NOT IN A ROOM', too_early: 'HANG ON — GIVE IT A FEW MORE SECONDS',
      }[p.code];
      if (msg) showToast(msg);
    },
  };

  function resetRoom() { S.code = null; S.slot = 0; S.roster = []; S.host = null; Net.roomId = null; }

  // ── screens ─────────────────────────────────────────────
  function go(screen) {
    S.screen = screen;
    if (screen === 'board') send('leaderboard.get', { limit: 10 });
    render();
  }

  function render() {
    playBuilt = false;
    $screen.innerHTML = '';
    const fn = SCREENS[S.screen];
    $screen.appendChild(fn());
    renderOverlay();
  }

  const SCREENS = {
    title() {
      const join = S.joinOpen
        ? (() => {
          const input = h('input', { class: 'field', placeholder: 'TT-XXXX', maxlength: '7', style: 'flex:1;text-transform:uppercase', autocapitalize: 'characters' });
          const submit = () => { const c = input.value.trim(); if (c) send('room.join', { code: c }); };
          input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
          setTimeout(() => input.focus(), 0);
          return h('div', { class: 'row', style: 'gap:8px' }, input, h('div', { class: 'btn ghost', style: 'height:48px;padding:0 16px', onclick: submit, text: 'JOIN' }));
        })()
        : h('div', { class: 'link', onclick: () => { S.joinOpen = true; render(); }, text: 'HAVE A CODE?' });
      return h('div', { class: 'col', style: 'height:100%;justify-content:space-between;padding:120px 34px 54px' },
        h('div', { class: 'col', style: 'gap:16px' },
          h('div', { style: 'width:34px;height:2px;background:' + AMBER }),
          h('div', { style: "font:300 38px/1.06 var(--mono);letter-spacing:.02em;color:" + INK }, 'THE', h('br'), 'TEAM', h('br'), 'TEST'),
          h('p', { style: 'margin:10px 0 0;font:400 13px/1.7 var(--sans);color:rgba(198,194,182,.66);max-width:250px;text-wrap:pretty', text: 'Four strangers. No chat. Everything you earn goes to someone else, and everything you drop is taken from them. When one of you runs out, all of you stop.' })),
        h('div', { class: 'col', style: 'gap:11px' },
          h('div', { class: 'btn primary', onclick: () => { S.briefNext = 'queue'; go('brief'); }, text: 'FIND A TEAM' }),
          h('div', { class: 'btn ghost', onclick: () => { S.briefNext = 'room'; go('brief'); }, text: 'PRIVATE ROOM' }),
          join,
          h('div', { class: 'row', style: 'justify-content:space-between;padding-top:4px' },
            h('div', { class: 'link', style: 'padding:6px 0', onclick: () => go('board'), text: 'LEADERBOARD' }),
            h('div', { class: 'link', style: 'padding:6px 0;font-size:10px;letter-spacing:.12em', title: 'Change your name', onclick: () => { S.nameOpen = true; S.joinOpen = false; render(); } },
              'NAME · ', span('color:' + INK + ';border-bottom:1px dashed rgba(198,194,182,.4)', (S.handle || pid).toUpperCase()), ' ✎'))),
        S.nameOpen ? nameEditor() : null);
    },

    brief() {
      const rule = (n, t) => h('div', { style: 'display:flex;gap:14px' },
        span('font:500 12px var(--mono);color:' + AMBER + ';padding-top:2px', n),
        h('p', { style: 'margin:0;font:400 13.5px/1.6 var(--sans);color:rgba(198,194,182,.85);text-wrap:pretty', text: t }));
      const dot = (c, label) => h('div', { class: 'row', style: 'gap:7px' },
        h('div', { style: 'width:9px;height:9px;border-radius:50%;background:' + c }), span('font:500 11px var(--mono);color:' + c, label));
      const arrow = () => span('font:400 13px var(--mono);color:rgba(198,194,182,.5)', '→');
      return h('div', { class: 'col', style: 'height:100%;padding:100px 30px 50px;gap:30px' },
        h('div', { class: 'col', style: 'gap:9px' },
          span('font:600 10px var(--mono);letter-spacing:.2em;color:' + AMBER, 'BEFORE YOU MATCH'),
          span('font:300 27px/1.2 var(--mono);color:' + INK, 'THE RULES')),
        h('div', { class: 'col', style: 'gap:20px' },
          rule('01', "Solve a task and the points land on your partner's meter. Never yours."),
          rule('02', 'Miss one and your partner pays for it. They cannot see why.'),
          rule('03', 'When any one meter empties, the run ends for all four of you.')),
        h('div', { class: 'col', style: 'border:1px solid rgba(198,194,182,.2);padding:18px 16px;gap:14px' },
          span('font:600 10px var(--mono);letter-spacing:.16em;color:rgba(198,194,182,.62)', 'THIS RUN'),
          h('div', { class: 'row', style: 'justify-content:center;gap:10px' },
            dot('rgba(198,194,182,.35)', '?'), arrow(), dot(INK, 'YOU'), arrow(), dot('rgba(198,194,182,.35)', '?')),
          span('font:400 11.5px/1.6 var(--sans);color:rgba(198,194,182,.62);text-align:center', 'Partners are drawn when the run starts. Watch the edges.')),
        h('div', { style: 'flex:1' }),
        h('div', {

  // Queue: stand-ins are opt-in, and only after a short wait.
  const Q = { bots: null };

  function jolt(ok) {

      { boxShadow: '0 0 0 0 transparent' },

  // ── tasks ───────────────────────────────────────────────

        p.name.style.color = on ? col : 'rgba(198,194,182,.55)';
        p.st.style.color = p.name.style.color;
        p.st.textContent = c.broken[p.seat] ? 'TORN' : on ? 'HOLDING' : 'OFF';
        p.pad.style.borderColor = on ? col : 'rgba(198,194,182,.18)';
        p.pad.style.background = on ? 'rgba(198,194,182,.12)' : 'rgba(198,194,182,.02)';
        p.pad.style.boxShadow = on ? 'inset 0 0 34px rgba(198,194,182,.14)' : 'none';
      });
      if (!c.holding[mySeat()] && c.broken[mySeat()]) tk.holding = false;
      const grip = c.grip[mySeat()], broken = c.broken[mySeat()];
      const gcol = broken ? DANGER : grip < 35 ? AMBER : 'rgba(198,194,182,.7)';
      ui.charge.style.width = Math.round((c.charge / c.need) * 100) + '%';
      ui.charge.style.background = c.charge > 0 ? GREEN : 'rgba(198,194,182,.2)';
      ui.grip.style.width = grip + '%'; ui.grip.style.background = gcol;
      ui.gripLbl.textContent = 'GRIP ' + grip + '%'; ui.gripLbl.style.color = gcol;
      ui.hint.textContent = broken ? 'GRIP TORN — WAIT FOR IT TO RECOVER' : tk.holding ? 'GRIP BURNS WHILE YOU HOLD — SPEND IT WHEN THEY ARE UP' : 'PRESS AND HOLD YOUR PAD';
    } else if (c.variant === 'relay' && ui.seats) {
      const venting = now() < c.ventUntil;                            // someone is venting (shared cooldown)
      const selfVenting = now() < ((c.ventLock || [])[mySeat()] || 0); // only the venter is locked out
      ui.seats.forEach((s) => {
        const active = !c.done && c.turn === s.seat && c.armed;
        const col = colOf(s.slot);
        s.el.style.borderColor = active ? col : 'rgba(198,194,182,.16)';
        s.el.style.background = active ? 'rgba(198,194,182,.11)' : 'rgba(198,194,182,.02)';
        s.name.style.color = active ? col : 'rgba(198,194,182,.55)';
      });
      const tcol = colOf(c.turn + 1);
      ui.charge.style.left = (12.5 + c.turn * 25) + '%';
      ui.charge.style.background = tcol; ui.charge.style.boxShadow = '0 0 14px 3px ' + tcol;
      const hcol = c.heat > 78 ? DANGER : c.heat > 48 ? AMBER : 'rgba(198,194,182,.45)';
      ui.heat.style.width = c.heat + '%'; ui.heat.style.background = hcol;
      ui.heatLbl.textContent = c.heat > 78 ? 'CRITICAL' : c.heat > 48 ? 'HOT' : 'NOMINAL'; ui.heatLbl.style.color = hcol;
      const mine = c.turn === mySeat(), armed = mine && c.armed;
      ui.tap.textContent = selfVenting ? 'VENTING' : mine ? (c.armed ? 'TAP NOW' : 'GET READY') : 'NOT YOUR TURN';
      ui.tap.style.borderColor = armed ? GREEN : 'rgba(198,194,182,.22)';
      ui.tap.style.background = armed ? 'rgba(95,201,138,.16)' : 'rgba(198,194,182,.03)';
      ui.tap.style.color = armed ? GREEN : 'rgba(198,194,182,.62)';
      ui.vent.textContent = venting ? 'VENTING…' : 'VENT';
      ui.vent.style.borderColor = c.heat > 48 ? AMBER : 'rgba(198,194,182,.22)';
      ui.vent.style.color = c.heat > 48 ? AMBER : 'rgba(198,194,182,.62)';
      ui.info.textContent = 'HOP ' + Math.min(c.hops, c.hop + 1) + ' / ' + c.hops + ' · WINDOW ' + c.windowMs + 'MS · VENT ON SOMEONE ELSE\'S TURN';
    }
  }

  // ── frame loop ──────────────────────────────────────────
  let lastFrame = performance.now();
  function frame(t) {
    const dt = Math.min(100, t - lastFrame); lastFrame = t;
    if (S.screen === 'queue') updateQueueButton();
    if (S.screen === 'play' && P && playBuilt) {
      // Life edges tween toward the server's numbers.
      let minLife = 100;
      for (const e of P.edges) {
        const r = rosterBySlot(e.slot);
        const id = r && r.playerId;
        const target = id != null && S.life[id] != null ? S.life[id] : 0;
        const cur = S.disp[id] != null ? S.disp[id] : target;
        const next = Math.abs(target - cur) < 0.04 ? target : cur + (target - cur) * 0.075;
        if (id) S.disp[id] = next;
        minLife = Math.min(minLife, next);
        // Only touch the DOM when something visible changed.
        const k = Math.max(0, next) / 100;
        if (Math.abs(k - (e.k == null ? -1 : e.k)) > 0.0005) { e.k = k; e.fill.style.transform = (e.horiz ? 'scaleX(' : 'scaleY(') + k.toFixed(4) + ')'; }
        const crit = next <= 25;
        if (crit !== e.crit) {
          e.crit = crit;
          e.fill.style.background = crit ? DANGER : e.c;
          e.label.style.color = crit ? DANGER : a(e.c, 0.85);
          e.label.style.animation = crit ? 'vlblink 1.1s steps(1,end) infinite' : 'none';
        }
        const txt = nameOf(e.slot) + ' ' + Math.round(next) + (crit ? ' CRITICAL' : '');
        if (e.label.textContent !== txt) e.label.textContent = txt;
        if (e.bead) {
          const p = S.pres[e.slot];
          const fresh = p && t - p.t < 2500;
          if (fresh) e.bx += ((e.horiz ? p.x : p.y) - e.bx) * 0.35;
          if (Math.abs(e.bx - (e.bxDrawn == null ? -1 : e.bxDrawn)) > 0.001) { e.bxDrawn = e.bx; e.bead.style[e.horiz ? 'left' : 'top'] = (e.bx * 100).toFixed(2) + '%'; }
          const op = r && (r.bot || fresh) ? '1' : '.35';
          if (e.bead.style.opacity !== op) e.bead.style.opacity = op;
          if (r && r.bot && !fresh) e.bx = 0.5 + 0.42 * Math.sin(t / 1000 * (0.5 + e.slot * 0.17) + e.slot); // stand-ins drift
        }
      }
      P.vignette.style.opacity = minLife <= 30 ? '1' : '0';
      const x = S.decay / 0.42;
      let line = 'DRAIN ×' + x.toFixed(1);
      if (S.rtt != null) line += ' · ' + S.rtt + 'MS';
      if (S.phase && !(S.task && S.task.coop) && !S.incoming) {
        line += S.cut ? ' · FINISH UP' : ' · CO-OP IN ' + fmt(Math.max(0, S.phase.cutoffAt - now()));
      }
      if (P.drain.textContent !== line) P.drain.textContent = line;
      P.drain.style.visibility = S.task && S.task.coop ? 'hidden' : 'visible'; // co-op header takes that row
      P.drain.style.color = S.decay > 0.92 ? DANGER : S.decay > 0.5 ? AMBER : 'rgba(198,194,182,.78)';

      const key = centerKey();
      if (key !== P.key) { P.key = key; renderCenter(); }
      const tk = S.task;
      if (tk && !tk.coop) animateTask(tk, dt);
      if (tk && tk.coop && tk.clockEl) {
        const left = Math.max(0, tk.a.deadline - now());
        tk.clockEl.textContent = fmt(left); tk.clockEl.style.color = left < 4000 ? DANGER : AMBER;
      }
      if (S.waiting) {
        const wc = P.center.querySelector('[data-waitclock]');
        if (wc) wc.textContent = 'CO-OP IN ≤ ' + (Math.max(0, S.waiting.until - now()) / 1000).toFixed(1);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => { if (Net.state === 'open') send('ping'); }, 3000); // RTT readout, once — never per frame

  const fmt = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtShort = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function fmtLong(ms) {
    const t = Math.max(0, ms);
    const m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000), c = Math.floor((t % 1000) / 10);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':' + String(c).padStart(2, '0');
  }

  // Desktop frame: scale the phone to fit the window.
  function fitPhone() {
    const el = document.getElementById('phone');
    if (window.innerWidth <= 500) { el.style.transform = ''; return; }
    const k = Math.min(1, (window.innerHeight - 24) / 874, (window.innerWidth - 24) / 402);
    el.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fitPhone);
  fitPhone();

  render();
})();
</script>
</body>
</html>
